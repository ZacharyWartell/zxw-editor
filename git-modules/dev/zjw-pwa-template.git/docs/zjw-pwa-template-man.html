<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>zjw-pwa-template-man</title>
    <link href="./modules/zxw-mvc/style.css" rel="stylesheet">
    <link href="./modules/zxw-mvc/technical-writing.css" rel="stylesheet">
    <link href="./modules/zjw-templates/styles.css" rel="stylesheet">
    <script type="importmap">
        {
          "imports": {
            "ZxW_MVC": "./modules/zxw-mvc/ZxW_MVC.js",
            "ZxW_GUI": "./modules/zxw-mvc/ZxW_GUI.js",
            "ZxW_Annotation": "./modules/zxw-mvc/ZxW_Annotation.js",
            "ZxW_TabContainer": "./modules/zxw-mvc/ZxW_TabContainer.js",
            "ZxW_Toolbar": "./modules/zxw-mvc/ZxW_Toolbar.js",
            "ZxW_TextEditor": "./modules/zxw-mvc/ZxW_TextEditor.js",

            "ZxW_Templates": "./modules/zjw-templates/main.js"
          }
        }
      </script>
    <script type="module">
      import * as zjwTemplate from "ZxW_Templates";                
      import * as ZxW_MVC from "ZxW_MVC";
      import * as ZxW_GUI from "ZxW_GUI";
      import * as ZxW_TabContainer from "ZxW_TabContainer";
      import * as ZxW_Toolbar from "ZxW_Toolbar";
      import * as ZxW_TextEditor from "ZxW_TextEditor";
      import * as ZxW_Annotation from "ZxW_Annotation";      
      ZxW_TabContainer.init();
      zjwTemplate.main(".", { enableToolbar: false });

      class App extends ZxW_GUI.DefaultApplication
      {
          constructor() { super(); }
          postUserDocumentLoadCallback()
          {
              zjwTemplate.onLoad();
          }
      }
      const app = new App();
      const toolbar = new ZxW_Toolbar.Toolbar(null,app);
      ZxW_Annotation.main(toolbar);
      ZxW_TextEditor.main(toolbar);
      ZxW_GUI.DefaultApplication.fetchUserDocument(app,"zjw-pwa-template-man.zxw-doc.html");
    </script>
    <style>
        *.Template::after
        {
            content: ""; /* "template" */
            margin-left: -15em;            
            background-color: rgb(128 128 128 / 0.5);
            border: 1px dashed red;
            z-index: 1;
        }
      	ul.DirectoryStructure, ul.DirectoryStructure ul
      	{
        }
      	ul.DirectoryStructure li > span:first-child
      	{
            font-weight: bold;
        }
        ul.DirectoryStructure span.Comment
        {
          	border: 1px dashed gray;
            margin: 2px;
        }
     		ul.DirectoryStructure span.Comment:before
      	{
          	content: "// ";
          	
      	}
    </style>
  </head>
  <body>
    <div id="UserDocument">
        <div class="SaveLoadContent">
        </div>
    </div>
  </body>
</html>
