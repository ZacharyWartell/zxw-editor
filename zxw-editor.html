<head>
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link rel="shortcut icon" type="image/png" href="icons/icon48.png">
    <link rel="shortcut icon" type="image/png" href="icons/icon144.png">    
    <style>
        table {
            border: solid 2px black;
            border-collapse: collapse;
            width: fit-content;
        }

        td {
            border: solid 1px;
        }

        menu {
            border: solid 2px black;
            padding: 2px;
        }
    </style>
    <script>
        let fileHandle = null;
        async function saveDOM(handle) {
            // Create a FileSystemWritableFileStream to write to.
            const writable = await handle.createWritable();
            // Write the contents of the file to the stream.
            let wholeDoc = new XMLSerializer().serializeToString(document);
            let splits = wholeDoc.split(/<script>|<\/script>/);
            wholeDoc = "";
            for (let i = 0; i < splits.length; i++) {
                if (i % 2 == 0) {// odd members are <script> elements
                    wholeDoc += splits[i];
                }
                else {// even members are <script> elements, so undo XMLSerializer conversion of certain characters into htmt entities (i.e. > to &amp;amp;amp;gt; )
                    /**
                     *  \todo this list is incomplete, need to find listing inte HTML spec's page and convert it into code...
                     */
                    const fixup = splits[i].replaceAll("\u0026gt;", ">").replaceAll("\u0026lt;", "<");
                    wholeDoc += "<script>" + fixup + "<\u002Fscript>";
                }
            }
            await writable.write(wholeDoc);
            await writable.close();
            console.log("saveDOM complete");
        }
        async function saveCallback() {
            if (fileHandle !== null)
                await saveDOM(fileHandle);
            else {
                const splits = document.documentURI.split("/");
                //const dir = FileSystemDirectoryHandle.getDirectoryHandle(decodeURIComponent(document.documentURI).replace(/\/.*\.html/,""));
                const options =
                {
                    //startIn: dir, //decodeURIComponent(document.documentURI),
                    suggestedName: decodeURIComponent(splits[splits.length - 1])
                };
                await window.showSaveFilePicker(options).then(
                    async (handle_) => {
                        fileHandle = handle_;
                        console.log(handle_);
                        await saveDOM(fileHandle);
                    });
            }
        }
        async function redactSaveCallback() 
        {
            const rs = document.querySelectorAll("*.Redacted");
            const rfs = []; // redactedFragments

            /** create DocuementFragments to temporarily hold all .Redacted HTMLElements */
            for (let r of rs)
            {
                const f = document.createDocumentFragment();
                let n = r.children[0];
                for (let n = r.children[0]; n !== null;)
                {
                    //c.remove();
                    const next = n.nextSibling;
                    f.appendChild(n);
                    n = next;
                }

                rfs.push(f);
            }
            console.log("redacted");
            await saveCallback();
            /** put back all .Redacted HTMLElements child nodes */
            let i=0;
            for (let r of rs)
            {            
                for (let c of rfs[i].childNodes)
                    r.appendChild(c);
                i++;
            }    
            console.log("unredacted");
            return;         
        }
        function main() {
            document.getElementById("SaveButton").addEventListener('click',saveCallback);                
            document.getElementById("RedactSaveButton").addEventListener('click',redactSaveCallback);                
        }
        window.main = main;                               
    </script>
</head>

<body onload="main();" style="overflow: hidden;">
    <div>
        <header style="border: 1px black solid; padding: 2px; resize: block; overflow: hidden; max-height: fit-content;">
            <div style="border: 1px black solid; padding: 2px; text-align: center;">
                <b><a target="_blank" href="https://github.com/ZacharyWartell/zxw-editor">zxw-editor</a></b> <sup><a target="_blank" href="https://github.com/ZacharyWartell/zxw-editor/commits/main/">(1.0.22)</a></sup> | Author: Zachary Wartell, License: 
                <a rel="license" target="_blank"
                    href="http://creativecommons.org/licenses/by-nc-sa/4.0/">Creative Commons
                    Attribution-NonCommercial-ShareAlike 4.0 International License</a>
            </div>
            <menu style="margin-bottom: 0px;">
                <button id="SaveButton">Save </button>
            </menu>
        </header>
        <div contenteditable="" style="overflow-y:scroll; height: 92vh;">
            ...your stuff goes here...
        </div>
    </div>
</body>
